name: PR Quality Gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  security:
    name: No Secrets in Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files
        run: |
          if find . -name ".env" -not -path "./.git/*" -not -name ".env*example" | grep -q .; then
            echo "ERROR: .env file found — remove it immediately."
            exit 1
          fi
          echo "No .env files committed."

  lint-and-build:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_ACCOUNT_API: http://localhost:3001/api/v1
          VITE_TV_API: http://localhost:3002/api/v1
          VITE_CATALOG_API: http://localhost:3003/api/v1
          VITE_BOOKING_API: http://localhost:3004/api/v1
          VITE_QUOTE_API: http://localhost:3005/api/v1
          VITE_JOB_API: http://localhost:3006/api/v1
          VITE_PAYMENT_API: http://localhost:3007/api/v1
          VITE_REVIEW_API: http://localhost:3008/api/v1
          VITE_NOTIF_API: http://localhost:3009/api/v1
