name: PR Quality Gate

on:
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: dm-homefix-backend

jobs:
  security-check:
    name: No Secrets in Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files
        working-directory: .
        run: |
          if find . -name ".env" -not -path "./.git/*" -not -name ".env.example" | grep -q .; then
            echo "ERROR: .env file committed. Remove it immediately."
            exit 1
          fi
          echo "No .env files found."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dm-homefix-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "services/**/*.ts" "libs/**/*.ts"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dm-homefix-backend/package-lock.json
      - run: npm ci
      - run: npm test

  build-check:
    name: TypeScript Compile Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dm-homefix-backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
