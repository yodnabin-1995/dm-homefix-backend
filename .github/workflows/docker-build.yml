name: Docker — Build, Push & Deploy

# Triggers on every push to main that touches backend code.
# Detects WHICH services changed and only rebuilds those images.
# After pushing images to GHCR, SSHes into the server and hot-swaps
# only the affected containers — zero downtime for unaffected services.

on:
  push:
    branches: [main]
    paths:
      - 'dm-homefix-backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dm-homefix

jobs:
  # ─── Detect which services changed ────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway:                        ${{ steps.filter.outputs.api-gateway }}
      account-service:                    ${{ steps.filter.outputs.account-service }}
      technician-verification-service:    ${{ steps.filter.outputs.technician-verification-service }}
      service-catalog-service:            ${{ steps.filter.outputs.service-catalog-service }}
      booking-service:                    ${{ steps.filter.outputs.booking-service }}
      pricing-quote-service:              ${{ steps.filter.outputs.pricing-quote-service }}
      job-management-service:             ${{ steps.filter.outputs.job-management-service }}
      payment-service:                    ${{ steps.filter.outputs.payment-service }}
      review-complaint-service:           ${{ steps.filter.outputs.review-complaint-service }}
      notification-service:               ${{ steps.filter.outputs.notification-service }}
      libs-changed:                       ${{ steps.filter.outputs.libs }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes per service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'dm-homefix-backend/services/api-gateway/**'
            account-service:
              - 'dm-homefix-backend/services/account-service/**'
            technician-verification-service:
              - 'dm-homefix-backend/services/technician-verification-service/**'
            service-catalog-service:
              - 'dm-homefix-backend/services/service-catalog-service/**'
            booking-service:
              - 'dm-homefix-backend/services/booking-service/**'
            pricing-quote-service:
              - 'dm-homefix-backend/services/pricing-quote-service/**'
            job-management-service:
              - 'dm-homefix-backend/services/job-management-service/**'
            payment-service:
              - 'dm-homefix-backend/services/payment-service/**'
            review-complaint-service:
              - 'dm-homefix-backend/services/review-complaint-service/**'
            notification-service:
              - 'dm-homefix-backend/services/notification-service/**'
            libs:
              - 'dm-homefix-backend/libs/**'
              - 'dm-homefix-backend/package*.json'
              - 'dm-homefix-backend/tsconfig*.json'
              - 'dm-homefix-backend/nest-cli.json'

  # ─── Build & Push changed images ──────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Run for a service if its own files changed OR shared libs changed
    if: |
      needs.detect-changes.outputs['api-gateway'] == 'true' ||
      needs.detect-changes.outputs['account-service'] == 'true' ||
      needs.detect-changes.outputs['technician-verification-service'] == 'true' ||
      needs.detect-changes.outputs['service-catalog-service'] == 'true' ||
      needs.detect-changes.outputs['booking-service'] == 'true' ||
      needs.detect-changes.outputs['pricing-quote-service'] == 'true' ||
      needs.detect-changes.outputs['job-management-service'] == 'true' ||
      needs.detect-changes.outputs['payment-service'] == 'true' ||
      needs.detect-changes.outputs['review-complaint-service'] == 'true' ||
      needs.detect-changes.outputs['notification-service'] == 'true' ||
      needs.detect-changes.outputs['libs-changed'] == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs['api-gateway'] }}
          - service: account-service
            changed: ${{ needs.detect-changes.outputs['account-service'] }}
          - service: technician-verification-service
            changed: ${{ needs.detect-changes.outputs['technician-verification-service'] }}
          - service: service-catalog-service
            changed: ${{ needs.detect-changes.outputs['service-catalog-service'] }}
          - service: booking-service
            changed: ${{ needs.detect-changes.outputs['booking-service'] }}
          - service: pricing-quote-service
            changed: ${{ needs.detect-changes.outputs['pricing-quote-service'] }}
          - service: job-management-service
            changed: ${{ needs.detect-changes.outputs['job-management-service'] }}
          - service: payment-service
            changed: ${{ needs.detect-changes.outputs['payment-service'] }}
          - service: review-complaint-service
            changed: ${{ needs.detect-changes.outputs['review-complaint-service'] }}
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs['notification-service'] }}

    # Skip this matrix entry if neither the service nor libs changed
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && needs.detect-changes.outputs['libs-changed'] != 'true'
        run: |
          echo "No changes detected for ${{ matrix.service }} — skipping build."
          exit 0

      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: dm-homefix-backend
          file: dm-homefix-backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── Deploy to server ─────────────────────────────────────────────────────
  deploy:
    name: Deploy — Hot-swap changed containers
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    continue-on-error: true   # skip gracefully if DEPLOY_HOST secret not configured
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build deploy script
        id: script
        run: |
          # Determine which services need redeployment
          SERVICES=""

          check() {
            local svc=$1
            local changed=$2
            local libs_changed="${{ needs.detect-changes.outputs['libs-changed'] }}"
            if [ "$changed" = "true" ] || [ "$libs_changed" = "true" ]; then
              SERVICES="$SERVICES $svc"
            fi
          }

          check "api-gateway"                     "${{ needs.detect-changes.outputs['api-gateway'] }}"
          check "account-service"                 "${{ needs.detect-changes.outputs['account-service'] }}"
          check "technician-verification-service" "${{ needs.detect-changes.outputs['technician-verification-service'] }}"
          check "service-catalog-service"         "${{ needs.detect-changes.outputs['service-catalog-service'] }}"
          check "booking-service"                 "${{ needs.detect-changes.outputs['booking-service'] }}"
          check "pricing-quote-service"           "${{ needs.detect-changes.outputs['pricing-quote-service'] }}"
          check "job-management-service"          "${{ needs.detect-changes.outputs['job-management-service'] }}"
          check "payment-service"                 "${{ needs.detect-changes.outputs['payment-service'] }}"
          check "review-complaint-service"        "${{ needs.detect-changes.outputs['review-complaint-service'] }}"
          check "notification-service"            "${{ needs.detect-changes.outputs['notification-service'] }}"

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to deploy: $SERVICES"

      - name: SSH into server and hot-swap containers
        if: steps.script.outputs.services != '' && secrets.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_PREFIX,REGISTRY
          script: |
            set -e

            REPO_DIR="/opt/dm-homefix-backend"
            REGISTRY="ghcr.io"
            IMAGE_PREFIX="ghcr.io/${{ github.repository_owner }}/dm-homefix"
            SERVICES="${{ steps.script.outputs.services }}"
            SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"

            echo "===  Logging in to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling latest code ==="
            cd "$REPO_DIR"
            git pull origin main

            for SVC in $SERVICES; do
              echo ""
              echo "=== Deploying: $SVC (image tag: $SHA_TAG) ==="

              IMAGE="${IMAGE_PREFIX}-${SVC}:${SHA_TAG}"

              # Pull the new image
              docker pull "$IMAGE"

              # Update docker-compose to use the new image tag
              # (uses the sha-tagged image for deterministic deploys)
              export IMAGE_TAG="$SHA_TAG"

              # Recreate only this service, keeping others running
              cd "$REPO_DIR/dm-homefix-backend"
              docker compose up -d --no-deps --pull never \
                --no-build \
                -e "IMAGE_TAG=${SHA_TAG}" \
                "$SVC"

              echo "=== $SVC deployed successfully ==="
            done

            echo ""
            echo "=== Running health checks ==="
            sleep 10
            docker compose ps

            echo "=== Deployment complete ==="
